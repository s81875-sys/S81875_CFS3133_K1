<!DOCTYPE html>
<html>
<head>
    <title>Interactive Contact Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;margin: 30px;background-color: #f2f2f2;
        }
        .header, .content, .footer {
            background-color:white;padding: 20px;
            margin-bottom: 15px;border-radius: 8px;
        }
        h1 {
            color: darkslateblue;
        }
        h2 {
            color:teal;
        }
        input {
            margin: 8px 0;padding: 8px;
        }
        button {
            padding: 10px 20px;
            background-color: darkslateblue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <!-- HEADER SECTION -->
    <div class="header">
        <h1>Contact Us</h1>
        <span>We would love to hear from you!</span>
    </div>

    <!-- CONTENT SECTION -->
    <div class="content">
        <h2>Contact Form</h2>
        <form>
            <label>Email Address:</label><br>
            <input type="email" placeholder="Enter your email" required>
            <br><br>

            <label>Preferred Contact Date:</label><br>
            <input type="date" required>
            <br><br>

            <label>Satisfaction Level:</label><br>
            <input type="range" min="0" max="10" value="5">
            <br><br>

            <button type="submit">Submit</button>
        </form>

        <!-- INLINE CALCULATOR -->
        <div>
            <h2>Inline Calculator</h2>

            <form id="calculator">
                <label>First Number:</label><br>
                <input type="number" id="num1" value="0">
                <br>

                <label>Second Number:</label><br>
                <input type="number" id="num2" value="0">
                <br><br>

                Sum: <output id="sum" for="num1 num2">0</output>
            </form>
        </div>
    </div>

    <!-- FOOTER SECTION -->
    <div class="footer">
        <h3>Contact Information</h3>
        <p>Email: contact@example.com</p>
        <p>&copy; 2026 Contact Us. All Rights Reserved.</p>
    </div>

    <script>
        const num1 = document.getElementById("num1");
        const num2 = document.getElementById("num2");
        const sum = document.getElementById("sum");

        function calculateSum() {
            sum.value = Number(num1.value) + Number(num2.value);
        }

        num1.addEventListener("input", calculateSum);
        num2.addEventListener("input", calculateSum);
    </script>

</body>
</html>
