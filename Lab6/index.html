<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Quiz Application</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>JavaScript Quiz Application</h1>
        <p>Test Your Knowledge!</p>
    </header>

    <main class="quiz-container">

        <section id="quiz-section">

            <div class="quiz-info">
                <p id="question-number">Question: 0/5</p>
                <p>Time: <span id="timer">15</span> seconds</p>
            </div>

            <h2 id="question">Welcome to the Quiz!</h2>

            <div id="answer-options"></div>

            <p id="feedback"></p>

            <button id="start-btn" onclick="startQuiz()">
                Start Quiz
            </button>

            <button id="submit-btn" onclick="checkAnswer()" hidden>
                Submit Answer
            </button>

            <button id="next-btn" onclick="nextQuestion()" hidden>
                Next Question
            </button>

        </section>

        <section id="result-section" hidden>
            <h2>Quiz Completed!</h2>
            <p id="final-score"></p>
            <button onclick="startQuiz()">Try Again</button>
        </section>

    </main>

    <footer>
        <p>JavaScript Quiz Application - Lab Exercise 6</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
